name: publish

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - tests/build_htslib.py
      - tests/validate_distribution.py
      - pyproject.toml
      - setup.py
      - MANIFEST.in
      - licenses/**
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAPLA_NATIVE: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Verify release version
        if: github.event_name == 'release'
        run: |
          python - <<'PY'
          import os
          from hapla import __version__

          if os.environ["GITHUB_REF_NAME"] != f"v{__version__}":
              raise SystemExit("Release tag and package version differ")
          PY
      - name: Build HTSlib
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes cmake zlib1g-dev
          python tests/build_htslib.py "$RUNNER_TEMP/htslib"
          echo "HTSLIB_PREFIX=$RUNNER_TEMP/htslib" >> "$GITHUB_ENV"
      - name: Build source distribution
        run: |
          python -m pip install build twine
          python -m build --sdist
          python tests/validate_distribution.py dist/*.tar.gz
          python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: distributions-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  wheels:
    name: ${{ matrix.name }} wheels
    needs: sdist
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            id: linux-x86_64
            os: ubuntu-latest
            arch: x86_64
          - name: Linux ARM64
            id: linux-aarch64
            os: ubuntu-24.04-arm
            arch: aarch64
          - name: macOS Intel
            id: macos-x86_64
            os: macos-15-intel
            arch: x86_64
          - name: macOS Apple Silicon
            id: macos-arm64
            os: macos-15
            arch: arm64
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install cmake libomp
      - name: Build and test wheels
        uses: pypa/cibuildwheel@v4.3.5
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_SKIP: "*-musllinux_*"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
          CIBW_ENVIRONMENT_LINUX: HAPLA_NATIVE=0 HTSLIB_PREFIX=/opt/htslib
          CIBW_BEFORE_ALL_LINUX: >-
            yum install -y cmake zlib-devel &&
            /opt/python/cp312-cp312/bin/python {project}/tests/build_htslib.py /opt/htslib
          CIBW_ENVIRONMENT_MACOS: >-
            HAPLA_NATIVE=0 HTSLIB_PREFIX=/tmp/hapla-htslib
            LIBOMP_PREFIX="$(brew --prefix libomp)" MACOSX_DEPLOYMENT_TARGET=15.0
          CIBW_BEFORE_ALL_MACOS: python {project}/tests/build_htslib.py /tmp/hapla-htslib
          CIBW_TEST_COMMAND: >-
            python {project}/tests/run.py --installed --threads 1 &&
            python {project}/tests/run.py --installed --threads 2 &&
            hapla --version
      - name: Validate wheel contents
        run: python tests/validate_distribution.py --bundled wheelhouse/*.whl
      - uses: actions/upload-artifact@v7
        with:
          name: distributions-${{ matrix.id }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs: [sdist, wheels]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/hapla
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: distributions-*
          path: dist
          merge-multiple: true
      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
