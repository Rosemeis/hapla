[build-system]
requires = [
    "setuptools>=77.0.0",
    "wheel",
    "cython>3.0.0",
    "numpy>2.0.0"
]
build-backend = "setuptools.build_meta"

[project]
name = "hapla"
dynamic = ["version"]
description = "Framework for haplotype clustering in phased genotype data"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    { name = "Jonas Meisner", email = "meisnerucph@gmail.com" }
]
dependencies = [
    "numpy>2.0.0"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Bio-Informatics"
]

[project.urls]
Homepage = "https://github.com/Rosemeis/hapla"
Documentation = "https://github.com/Rosemeis/hapla#readme"
Issues = "https://github.com/Rosemeis/hapla/issues"
Source = "https://github.com/Rosemeis/hapla"

[project.scripts]
hapla = "hapla.main:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.dynamic]
version = { attr = "hapla.__version__" }

[tool.setuptools.packages.find]
include = ["hapla*"]

[tool.setuptools.package-data]
hapla = ["*.pyx"]

[tool.setuptools.exclude-package-data]
hapla = ["*.c"]

[tool.ruff]
line-length = 100

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false
